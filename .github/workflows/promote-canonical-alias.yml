name: Promote canonical Vercel alias

# Keep every production host on the latest deployment (canonical Vercel alias + rtacademia custom domains).
# Without this, sticky aliases can lag behind git-linked deploys and serve stale UI.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Promote production aliases
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing — cannot promote production aliases"
            exit 1
          fi
          npm run vercel:promote-canonical
